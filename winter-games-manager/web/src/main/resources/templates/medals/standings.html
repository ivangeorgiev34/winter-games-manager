<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Medal Standings')"></head>
<body>
<div th:replace="fragments/layout :: navbar"></div>

<main class="container mt-4">
    <h2>Medal Standings</h2>
    <table class="table table-bordered">
        <thead class="table-warning">
        <tr><th>Country</th><th>Gold</th><th>Silver</th><th>Bronze</th><th>Total</th></tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${standings}">
            <td th:text="${entry.key}"></td>
            <td th:text="${entry.value.gold}"></td>
            <td th:text="${entry.value.silver}"></td>
            <td th:text="${entry.value.bronze}"></td>
            <td th:text="${entry.value.gold + entry.value.silver + entry.value.bronze}"></td>
        </tr>
        <tr th:if="${standings.isEmpty()}">
            <td colspan="5" class="text-center">No medals awarded yet.</td>
        </tr>
        </tbody>
    </table>
    <div class="card mt-4">
        <div class="card-body">
            <h5>Statistics</h5>
            <p>Average age of participants: <strong th:text="${avgAge}"></strong> years</p>
            <p>Youngest medalist: <span th:text="${youngest != null ? youngest.name : '—'}"></span> (<span th:text="${youngest != null ? youngest.country : '—'}"></span>)</p>
            <p>Oldest medalist: <span th:text="${oldest != null ? oldest.name : '—'}"></span> (<span th:text="${oldest != null ? oldest.country : '—'}"></span>)</p>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
</body>
</html>
