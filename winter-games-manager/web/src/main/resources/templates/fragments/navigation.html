<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navigation" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <i class="bi bi-snow2"></i> Winter Games Manager
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/events}">Events</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/athletes}">Athletes</a></li>
            </ul>

            <!-- Not authenticated -->
            <div sec:authorize="!isAuthenticated()" class="d-flex">
                <a class="btn btn-outline-light me-2" th:href="@{/login}">Login</a>
                <a class="btn btn-primary" th:href="@{/register}">Register</a>
            </div>

            <!-- Authenticated -->
            <div sec:authorize="isAuthenticated()" class="d-flex">
                <span class="navbar-text text-light me-3">
                    <i class="bi bi-person-circle"></i> <span sec:authentication="name">User</span>
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
