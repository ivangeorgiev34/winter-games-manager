<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Winter Olympics</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <style>
        body { padding-top: 70px; }
        .footer { margin-top: 50px; text-align: center; color: #6c757d; }
    </style>
</head>
<body>
<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-info fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Winter Olympics</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/competitions}">Competitions</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/medals}">Medals</a></li>
                </ul>
                <div class="d-flex" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light me-2" th:href="@{/login}">Login</a>
                    <a class="btn btn-light" th:href="@{/register}">Register</a>
                </div>
                <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-3" sec:authentication="name"></span>

                    <div sec:authorize="hasRole('ATHLETE')" class="me-2">
                        <a class="btn btn-outline-light btn-sm me-1" th:href="@{/athlete/profile}">Profile</a>
                        <a class="btn btn-outline-light btn-sm me-1" th:href="@{/athlete/register}">Register</a>
                        <a class="btn btn-outline-light btn-sm me-1" th:href="@{/athlete/registrations}">My Regs</a>
                    </div>

                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</div>

<main class="container mt-4" th:fragment="content">
</main>

<div th:fragment="footer">
    <footer class="footer">
        <p>&2026 Winter Olympics Management</p>
    </footer>
</div>
</body>
</html>
