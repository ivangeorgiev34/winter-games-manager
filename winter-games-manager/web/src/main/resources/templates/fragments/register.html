<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Register Athlete')"></head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <div class="card">
        <div class="card-header bg-success text-white">New Athlete Registration</div>
        <div class="card-body">
            <form th:action="@{/register}" th:object="${athlete}" method="post">
                <h5>Personal info</h5>
                <div class="mb-3"><label>Name</label><input type="text" th:field="*{name}" class="form-control" required></div>
                <div class="mb-3"><label>Country</label><input type="text" th:field="*{country}" class="form-control" required></div>
                <div class="mb-3">
                    <label>Gender</label>
                    <select th:field="*{gender}" class="form-select">
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                    </select>
                </div>
                <div class="mb-3"><label>Date of birth</label><input type="date" th:field="*{dateOfBirth}" class="form-control" required></div>

                <hr>
                <h5>Account credentials</h5>
                <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" required></div>
                <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control" required></div>

                <button type="submit" class="btn btn-success">Register</button>
                <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
