<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Edit Profile')"></head>
<body>
<div th:replace="fragments/layout :: navbar"></div>
<main class="container mt-4" style="max-width: 600px;">
    <h2>Edit Profile</h2>
    <form th:action="@{/athlete/profile/edit}" th:object="${athlete}" method="post">
        <div class="mb-3"><label>Name</label><input type="text" th:field="*{name}" class="form-control" required></div>
        <div class="mb-3"><label>Country</label><input type="text" th:field="*{country}" class="form-control" required></div>
        <div class="mb-3"><label>Gender</label>
            <select th:field="*{gender}" class="form-select">
                <option value="MALE">Male</option><option value="FEMALE">Female</option>
            </select>
        </div>
        <div class="mb-3"><label>Date of Birth</label><input type="date" th:field="*{dateOfBirth}" class="form-control" required></div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/athlete/profile}" class="btn btn-secondary">Cancel</a>
    </form>
</main>
</body>
</html>
