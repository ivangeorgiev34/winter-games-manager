<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common :: common-head(~{::title})}">
    <title>Login</title>
</head>
<body>
<div th:insert="fragments/navigation :: navigation"></div>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h2 class="mt-2 fw-semibold">Welcome back</h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <div>Invalid username or password. Please try again.</div>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <div>You have been logged out successfully.</div>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
                                <label for="username"><i class="bi bi-person"></i> Username</label>
                            </div>

                            <div class="form-floating mb-2">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                                <label for="password"><i class="bi bi-key"></i> Password</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                            </button>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
<div th:replace="~{common :: common-scripts}"></div>
</body>
</html>
