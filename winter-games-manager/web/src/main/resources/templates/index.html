<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<head th:replace="fragments/layout :: head('Home')"></head>
<body>
<div th:replace="fragments/layout :: navbar"></div>

<main class="container mt-4">
    <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">Winter Olympics 2026</h1>
            <p class="col-md-8 fs-4">
                Alpine Ski Slalom & Biathlon – official results, real‑time rankings, medal standings.
            </p>
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/register}" class="btn btn-primary btn-lg">Register as Athlete</a>
            </div>
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/competitions/new/slalom}" class="btn btn-warning btn-lg">➕ Add Competition</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
</body>
</html>
